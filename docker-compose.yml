name: lazentinel

services:
  app:
    image: wisdomsky/lazentinel:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lazentinel
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    ports:
      - "${APP_PORT:-3008}:3008"
    environment:
      NODE_ENV: production
      PORT: 3008
      DEFAULT_TRACKING_INTERVAL_MINUTES: ${DEFAULT_TRACKING_INTERVAL_MINUTES:-}
      DATABASE_PATH: /app/data/lazentinel.db
      AUTH_DATABASE_PATH: /app/data/lazentinel-auth.db
      CLIENT_DIST: /app/client/dist
      ENABLE_MULTIUSER: ${ENABLE_MULTIUSER:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CLOAKBROWSER_LICENSE_KEY: ${CLOAKBROWSER_LICENSE_KEY:-}
      CLOAKBROWSER_PROXY: ${CLOAKBROWSER_PROXY:-}
      PROXY_ENABLED: ${PROXY_ENABLED:-true}
      PROXY_SCHEME: ${PROXY_SCHEME:-http}
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:-}
    volumes:
      - ./.lazentinel-data:/app/data

