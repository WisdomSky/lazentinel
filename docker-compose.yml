name: lazentinel

services:
  app:
    image: wisdomsky/lazentinel:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lazentinel
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    ports:
      - "${APP_PORT:-3008}:3008"
    environment:
      NODE_ENV: production
      PORT: 3008
      DATABASE_PATH: /app/data/lazentinel.db
      AUTH_DATABASE_PATH: /app/data/lazentinel-auth.db
      CLIENT_DIST: /app/client/dist
      ENABLE_MULTIUSER: ${ENABLE_MULTIUSER:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./.lazentinel-data:/app/data

